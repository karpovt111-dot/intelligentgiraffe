<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Получение награды — Интеллектуальный жирафик</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #faf7f0; color: #1c1a15; line-height: 1.55;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px 80px;
  }
  .wrap { width: 100%; max-width: 780px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
  .brand-emoji { font-size: 22px; }
  .back { color: #5a5142; font-size: 14px; font-weight: 700; text-decoration: none; }
  .back:hover { color: #d68910; }

  .card {
    background: #fff; border: 1px solid #ebe2cf; border-radius: 18px;
    padding: 32px; box-shadow: 0 8px 28px rgba(28,26,21,0.08);
  }
  .card h1 { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
  .card .sub { color: #5a5142; font-size: 14px; margin-bottom: 22px; }

  /* Предпросмотр */
  .preview {
    border: 2px dashed #ebe2cf; border-radius: 12px; padding: 28px 24px;
    text-align: center; background: #fffdf8; margin-bottom: 24px;
  }
  .preview-award {
    font-size: 26px; font-weight: 900; color: #d68910;
    letter-spacing: -0.01em; margin-bottom: 8px;
  }
  .preview-sub { font-size: 12px; color: #8e8575; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px; }
  .preview-name {
    font-size: 22px; font-weight: 800; color: #1c1a15;
    border-bottom: 2px solid #ebe2cf; display: inline-block;
    min-width: 240px; padding: 4px 10px; margin-bottom: 14px;
    outline: none;
  }
  .preview-name:empty::before {
    content: 'Фамилия Имя Отчество'; color: #c9bfa8;
  }
  .preview-text { font-size: 14px; color: #5a5142; max-width: 460px; margin: 0 auto; }
  .preview-result { font-size: 13px; color: #8e8575; margin-top: 12px; }

  /* Поля */
  .field-label { font-size: 13px; font-weight: 700; color: #5a5142; display: block; margin-bottom: 6px; }
  .q-input {
    width: 100%; padding: 12px 14px; border: 1.5px solid #ebe2cf; border-radius: 10px;
    font-size: 15px; font-family: inherit; background: #faf7f0; color: #1c1a15;
    margin-bottom: 16px;
  }
  .q-input:focus { outline: none; border-color: #f5a623; background: #fff; box-shadow: 0 0 0 4px rgba(245,166,35,0.15); }

  .btn {
    padding: 14px 24px; border-radius: 10px; font-size: 16px; font-weight: 800;
    cursor: pointer; border: 1.5px solid transparent; font-family: inherit;
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; width: 100%;
  }
  .btn-primary { background: linear-gradient(135deg, #f5a623, #d68910); color: #fff;
    box-shadow: 0 4px 14px rgba(245,166,35,0.35); }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-outline { background: #fff; color: #1c1a15; border-color: #d9cfb7; }

  .msg { font-size: 13px; color: #8e8575; text-align: center; margin-top: 12px; }
  .msg.ok { color: #2b7a2b; }
  .msg.err { color: #d9534f; }

  .empty-state { text-align: center; padding: 40px 20px; color: #8e8575; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="brand-emoji">🦒</span> Интеллектуальный жирафик</div>
    <a class="back" href="math_1.html">← К олимпиаде</a>
  </div>

  <div class="card" id="card">
    <div class="empty-state">Загрузка…</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const card = document.getElementById('card');
  let data = null;

  try {
    const raw = localStorage.getItem('pending_award');
    if (raw) data = JSON.parse(raw);
  } catch (e) {}

  if (!data) {
    card.innerHTML = `
      <div class="empty-state">
        <p style="font-size:16px;margin-bottom:12px;">Нет данных о награде.</p>
        <a class="btn btn-outline" href="math_1.html" style="max-width:280px;margin:0 auto;">
          Пройти олимпиаду
        </a>
      </div>`;
    return;
  }

  // Сохраняем имя, чтобы не вводить повторно
  const nameKey = 'pending_award_name';
  const savedName = localStorage.getItem(nameKey) || '';

  card.innerHTML = `
    <h1>Получение награды</h1>
    <p class="sub">Проверьте данные и подтвердите покупку.</p>

    <div class="preview">
      <div class="preview-award">${escapeHtml(data.awardTitle)}</div>
      <div class="preview-sub">${escapeHtml(data.subject || 'Олимпиада')}</div>
      <div class="preview-name" id="previewName" contenteditable="true"
           spellcheck="false">${escapeHtml(savedName)}</div>
      <div class="preview-text">
        награждается за успешное прохождение олимпиады
      </div>
      <div class="preview-result">
        Результат: ${data.correct} из ${data.total} (${data.pct}%)
      </div>
    </div>

    <label class="field-label" for="nameInput">ФИО участника (как в дипломе)</label>
    <input id="nameInput" class="q-input" type="text"
           placeholder="Иванов Иван Иванович" value="${escapeHtml(savedName)}"
           autocomplete="off">

    <button id="buyBtn" class="btn btn-primary">
      Купить за ${data.price} ₽ и скачать
    </button>
    <div class="msg" id="msg"></div>
  `;

  const nameInput = document.getElementById('nameInput');
  const previewName = document.getElementById('previewName');
  const buyBtn = document.getElementById('buyBtn');
  const msg = document.getElementById('msg');

  function syncName(val) {
    nameInput.value = val;
    previewName.textContent = val;
  }
  nameInput.addEventListener('input', function () { syncName(nameInput.value); });
  previewName.addEventListener('input', function () { syncName(previewName.textContent); });

  buyBtn.addEventListener('click', function () {
    const name = nameInput.value.trim();
    if (!name) {
      msg.textContent = 'Пожалуйста, введите ФИО.';
      msg.className = 'msg err';
      nameInput.focus();
      return;
    }
    localStorage.setItem(nameKey, name);

    // Демо-покупка: без реальной оплаты сразу скачиваем текстовый файл
    buyBtn.disabled = true;
    msg.textContent = 'Готовим файл…';
    msg.className = 'msg';

    try {
      const text = buildAwardText(name, data);
      downloadText(text, `nagrada_${slug(name)}.txt`);
      msg.textContent = 'Файл скачан. Спасибо за покупку!';
      msg.className = 'msg ok';

      // Сообщаем серверу (опционально)
      const fd = new FormData();
      fd.append('filename', data.filename || 'math_1.html');
      fd.append('correct', data.correct);
      fd.append('total', data.total);
      fd.append('award', data.awardKey);
      fd.append('participant', name);
      fetch('/olympiads/submit', { method: 'POST', body: fd, credentials: 'same-origin' })
        .catch(function (e) { console.warn(e); });
    } catch (e) {
      console.error(e);
      msg.textContent = 'Ошибка: ' + e.message;
      msg.className = 'msg err';
    } finally {
      buyBtn.disabled = false;
    }
  });

  function buildAwardText(name, d) {
    const date = new Date().toLocaleDateString('ru-RU', {
      day: 'numeric', month: 'long', year: 'numeric'
    });
    return [
      '================================================',
      '           ИНТЕЛЛЕКТУАЛЬНЫЙ ЖИРАФИК',
      '================================================',
      '',
      '           ' + d.awardTitle.toUpperCase(),
      '',
      'Награждается:',
      '  ' + name,
      '',
      'За успешное прохождение олимпиады:',
      '  ' + (d.subject || 'Олимпиада'),
      '',
      'Результат: ' + d.correct + ' из ' + d.total + ' (' + d.pct + '%)',
      'Дата: ' + date,
      '',
      'Стоимость награды: ' + d.price + ' ₽',
      '',
      '================================================',
      'Организатор: Интеллектуальный жирафик',
      '================================================'
    ].join('\n');
  }

  function downloadText(text, filename) {
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function slug(s) {
    return s.replace(/\s+/g, '_').replace(/[^\wА-Яа-яЁё_-]/g, '');
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
})();
</script>
</body>
</html>
